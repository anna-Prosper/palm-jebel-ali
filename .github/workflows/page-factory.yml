name: Page factory

# Generates ONE new content page per day from the curated backlog in
# scripts/content-backlog.json, then wires, builds, fact-checks and pushes it.
# Vercel deploys on the resulting push.
#
# This replaces a Claude Code session-only cron, which only fired while a
# laptop session was alive and expired after 7 days — it had been dead for
# ~2 months before this workflow existed. Full procedure and the
# non-negotiable fact-discipline live in scripts/PAGE_FACTORY.md.

on:
  schedule:
    # 04:17 UTC daily (08:17 Gulf). Off the :00/:30 marks on purpose.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Pages to generate this run"
        required: false
        default: "1"

concurrency:
  # Two runs would draft the same backlog item and race on push.
  group: page-factory
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Nothing to do once the finite backlog is done. Checked before invoking
      # Claude so an exhausted backlog costs no tokens.
      - id: scope
        name: Pick the next backlog item
        run: |
          N='${{ github.event.inputs.count || 1 }}'
          node scripts/pending.mjs "$N" > /tmp/pending.json
          cat /tmp/pending.json
          echo "exhausted=$(python3 -c "import json;print(str(json.load(open('/tmp/pending.json'))['exhausted']).lower())")" >> "$GITHUB_OUTPUT"
          {
            echo 'items<<PJAEOF'
            cat /tmp/pending.json
            echo 'PJAEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Draft the page
        if: steps.scope.outputs.exhausted == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 40
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
          prompt: |
            You are running the Palm Jebel Ali page factory inside GitHub Actions.

            READ `scripts/PAGE_FACTORY.md` FIRST and follow it exactly. Its
            guardrails are non-negotiable: numbers ONLY from
            `lib/content/palm-facts.ts`; no invented prices, sizes, yields,
            percentages, dates, counts or specs; pre-handover honesty (nothing
            is completed, no live rents/yields); competitor/tax/visa/legal
            content stays qualitative and hedged; no fabricated proper nouns
            (hotels, schools, restaurants, marinas). If a page cannot be
            written honestly from available facts, SKIP it and say why.

            The backlog item(s) to build this run — already selected, do not
            re-pick:

            ```json
            ${{ steps.scope.outputs.items }}
            ```

            Do steps 2 through 6 of the runbook:
              2. Draft `lib/content/<file>.ts` for the item, using the runbook's
                 subagent prompt template as the spec for structure and tone.
              3. Verify the file exists and exports the named const.
              4. Run `node scripts/gen-registry.mjs` (never hand-edit registry.ts).
              5. Run `npm run build`. Fix any error in the content file and
                 rebuild until green.
              6. Run the runbook's fact-check grep over the new file and remove
                 any figure outside the allowed list, then rebuild.

            Do NOT git commit, push, or tag. A later workflow step does that.
            Finish by printing the slug and title of the page you built.

      # Committing here rather than in the prompt: the workflow decides what
      # ships, so a drafting run that goes sideways cannot push on its own.
      - name: Commit and push
        if: steps.scope.outputs.exhausted == 'false'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes produced — nothing to ship."
            exit 0
          fi
          git config user.name "palm-jebel-ali page factory"
          git config user.email "actions@github.com"
          SLUGS=$(git status --porcelain lib/content | grep -oE 'lib/content/.*\.ts' | grep -v 'registry\.ts' | xargs -n1 basename 2>/dev/null | sed 's/\.ts$//' | paste -sd, - || true)
          [ -n "$SLUGS" ] || SLUGS="content"
          git add -A
          git commit -m "feat(cluster): page factory — ${SLUGS}" \
                     -m "Generated by the scheduled page-factory workflow." \
                     -m "Co-Authored-By: Claude <noreply@anthropic.com>"
          git push origin HEAD:main

      - name: Report
        if: always()
        run: |
          echo "### Page factory" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.scope.outputs.exhausted }}" = "true" ]; then
            echo "Backlog exhausted — nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/pending.mjs 1 | python3 -c "import json,sys;d=json.load(sys.stdin);print(f\"built **{d['built']}** / {d['totalBacklog']} · **{d['pending']}** pending\")" >> "$GITHUB_STEP_SUMMARY"
          fi
